name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build library
        run: pnpm build

      - name: Verify package
        run: pnpm verify:package

      - name: Build Storybook
        run: pnpm build-storybook

  react-18:
    name: Test against React 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Peer range is ^18.2 || ^19 — make sure the lower bound keeps working.
      - name: Install React 18
        run: pnpm add -D react@18 react-dom@18 @types/react@18 @types/react-dom@18

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck
