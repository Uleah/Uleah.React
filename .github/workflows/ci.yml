name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Uses the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Requires the build output above.
      - name: Verify package
        run: pnpm verify:package

      - name: Build Storybook
        run: pnpm build-storybook

  react-18:
    # Different React major, not a duplicate: guards the lower bound of the
    # peer range (^18.2 || ^19). Only runtime tests and types are re-run.
    name: Test against React 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install React 18
        run: pnpm add -D react@18 react-dom@18 @types/react@18 @types/react-dom@18

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

  package-windows:
    # The package checks spawn npm and create directory links, which behave
    # differently on Windows (npm.cmd wrapper, symlink privileges).
    name: Verify package on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify package
        run: pnpm verify:package
